# Legacy pinned Clavis QuickShell source used by quickshell/dual when
# QUICKSHELL_LOCAL_SOURCE is unset. The install path clones this ref under
# ${XDG_DATA_HOME:-~/.local/share}/quickshell/clavis and runs its install.sh.
#
# For the new upstream CMake checkout, do not retarget this pin at a personal
# commit. Instead export QUICKSHELL_LOCAL_SOURCE to an absolute existing tree
# that contains shell.qml and CMakeLists.txt. That mode builds with top-level
# CMake/Ninja into <source>/build/qml, writes state/dotfiles/quickshell-config-path,
# never fetches/checks out/discards dirty work, and never runs upstream install.sh.
QUICKSHELL_REPOSITORY=https://github.com/ZChenW/quickshell.git
QUICKSHELL_REF=689f57d984dbad1aee45ed9ce5f495981ee3fba4
