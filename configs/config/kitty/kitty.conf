include hyde.conf

shell /usr/bin/zsh

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
wayland_titlebar_color background
include matugen.conf

# herdcat: let the desktop pet focus the kitty split that holds an agent.
# Only the focus-window action is permitted; other remote-control commands
# (reading or typing into windows, opening or closing them) stay disabled.
allow_remote_control password
remote_control_password "" focus-window
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
# herdcat: report the focused split so the cat knows which agent is being typed to.
watcher herdcat_watcher.py
