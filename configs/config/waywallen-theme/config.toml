# Desktop colours are generated by matugen from the wallpaper on the focused
# display. ~/.local/bin/waywallen-theme-sync reads this file on every change.
# After editing templates, delete ~/.cache/waywallen-theme/palettes.

mode = "dark"               # dark | light
scheme = "scheme-vibrant"   # any value matugen accepts for --type

# template in ./templates = file it is written to
[outputs]
"waybar-colors.css" = "@CONFIG_HOME@/waybar/colors.css"
"kitty.conf" = "@CONFIG_HOME@/kitty/matugen.conf"
"niri.kdl" = "@CONFIG_HOME@/niri/theme-colors.kdl"
"zsh.zsh" = "~/.cache/waywallen-theme/colors.zsh"
"btop.theme" = "@CONFIG_HOME@/btop/themes/matugen.theme"
"cava.conf" = "@CONFIG_HOME@/cava/config"
"fcitx5-theme.conf" = "~/.local/share/fcitx5/themes/Matugen/theme.conf"
"yazi.toml" = "@CONFIG_HOME@/yazi/theme.toml"
"gtk-3.0.css" = "@CONFIG_HOME@/gtk-3.0/waywallen-colors.css"
"gtk-4.0.css" = "@CONFIG_HOME@/gtk-4.0/waywallen-colors.css"
"wlogout.css" = "@CONFIG_HOME@/wlogout/colors.css"
"swaylock.conf" = "@CONFIG_HOME@/swaylock/config"
