# Lock screen for swaylock-effects: blurred screenshot, clock and date inside the ring.
# Colours are generated by matugen from the wallpaper (waywallen-theme-sync).
daemonize
ignore-empty-password
screenshots
effect-blur=18x4
effect-vignette=0.35:0.65
fade-in=0.25
clock
timestr=%H:%M
datestr=%a, %b %-d
font=Maple Mono NF CN
indicator
indicator-idle-visible
indicator-radius=130
indicator-thickness=8

inside-color={{colors.surface.default.hex_stripped}}cc
inside-clear-color={{colors.surface.default.hex_stripped}}cc
inside-ver-color={{colors.surface.default.hex_stripped}}cc
inside-wrong-color={{colors.error_container.default.hex_stripped}}cc
ring-color={{colors.outline_variant.default.hex_stripped}}
ring-clear-color={{colors.tertiary.default.hex_stripped}}
ring-ver-color={{colors.primary.default.hex_stripped}}
ring-wrong-color={{colors.error.default.hex_stripped}}
key-hl-color={{colors.primary.default.hex_stripped}}
bs-hl-color={{colors.error.default.hex_stripped}}
text-color={{colors.on_surface.default.hex_stripped}}
text-clear-color={{colors.on_surface.default.hex_stripped}}
text-ver-color={{colors.on_surface.default.hex_stripped}}
text-wrong-color={{colors.on_error_container.default.hex_stripped}}
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
