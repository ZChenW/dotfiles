# kitty on macOS (installed by scripts/macos.sh in place of the Linux kitty.conf).
# hyde.conf, theme.conf and matugen.conf are the shared Linux files.
include hyde.conf

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# hyde.conf's 9.5 is sized for Linux; macOS points are larger on Retina.
font_size        14.0

include matugen.conf

# Left Option is the OmniWM Mod key; Right Option is Alt/Meta for zsh and nvim.
macos_option_as_alt right
macos_titlebar_color background
macos_quit_when_last_window_closed yes

# kitty-new-window (Option+T) opens windows through this socket; kitty adds -<pid>.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-${USER}
